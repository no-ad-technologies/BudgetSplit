# CI skeleton (Ch. 10). Runs on every pull request and every push to main.
# All three jobs must pass before a PR can merge, and Render deploys main only after they pass
# (render.yaml: autoDeployTrigger: checksPass).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · typecheck, migrate, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: budgetsplit
          POSTGRES_PASSWORD: budgetsplit
          POSTGRES_DB: budgetsplit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetsplit -d budgetsplit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://budgetsplit:budgetsplit@localhost:5432/budgetsplit_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (also generates the Prisma client)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck -w @budgetsplit/api
      - name: Apply migrations to the throwaway test database
        run: npm run db:migrate:deploy -w @budgetsplit/api
      - name: Unit and integration tests
        run: npm test -w @budgetsplit/api
      - name: Bundle
        run: npm run build -w @budgetsplit/api
      - name: Audit production dependencies (fails on critical)
        run: npm audit --omit=dev --audit-level=critical -w @budgetsplit/api

  client:
    name: Shared + mobile · typecheck, test, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w @budgetsplit/shared -w @budgetsplit/mobile
      - name: Unit tests
        run: npm test -w @budgetsplit/shared -w @budgetsplit/mobile
      - name: Bundle the app with Metro (catches broken imports and config)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://budgetsplit-api.onrender.com

  docker:
    name: Docker · API image builds
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the same image Render will run (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: budgetsplit-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

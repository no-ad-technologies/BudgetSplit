# Render Blueprint: the production deployment as code (Ch. 10, infrastructure as code).
# Render reads this file from the repo root: Dashboard -> New -> Blueprint -> pick this repo.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: budgetsplit-api
    runtime: docker
    # Free while developing. Switch to 0.5c-512mb (Starter, $7/month) for demo weeks:
    # free web services spin down after 15 idle minutes and take about a minute to wake.
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy only commits whose GitHub checks (the CI workflow) passed.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: budgetsplit-db
          property: connectionString
      - key: AUTH_MODE
        value: dev
      # M2 demo only: the deployed walking skeleton holds seed data and uses the dev auth stub.
      # Delete this variable when US-01 (Firebase Auth) ships; the API then refuses dev auth in production.
      - key: ALLOW_DEV_AUTH_IN_PRODUCTION
        value: "true"

databases:
  - name: budgetsplit-db
    # Paid from day one ($6/month): free Postgres expires after 30 days and has no backups.
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "17"
    databaseName: budgetsplit
    user: budgetsplit
